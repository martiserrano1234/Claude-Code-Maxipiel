<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background:#111; }

  .hs-active {
    background: linear-gradient(135deg, #b01800 0%, #e8341a 40%, #ff6b00 70%, #e8341a 100%);
    background-size: 300% 300%;
    animation: gradMove 6s ease infinite;
    color: #fff;
    padding: 12px 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
    border-bottom: 3px solid #ff6b00;
  }

  @keyframes gradMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .hs-active::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    animation: shimmer 2.5s infinite;
  }

  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  .hs-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .hs-logo {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hs-fire { font-size: 24px; animation: flicker 1s infinite alternate; }
  @keyframes flicker {
    0% { transform: scale(1) rotate(-4deg); filter: brightness(1); }
    100% { transform: scale(1.15) rotate(4deg); filter: brightness(1.3); }
  }

  .hs-hs {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .hs-badge {
    background: rgba(0,0,0,0.25);
    border: 1.5px solid rgba(255,255,255,0.35);
    border-radius: 6px;
    padding: 5px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .hs-badge-pct {
    font-size: 18px;
    font-weight: 900;
    line-height: 1;
  }

  .hs-badge-txt {
    font-size: 10px;
    line-height: 1.3;
    opacity: 0.9;
    text-align: left;
  }

  .hs-divider {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.3);
  }

  .hs-end {
    font-size: 11px;
    opacity: 0.85;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .hs-end-countdown {
    font-weight: 700;
    font-size: 12px;
    background: rgba(0,0,0,0.2);
    padding: 2px 8px;
    border-radius: 20px;
    font-variant-numeric: tabular-nums;
  }

  .hs-cta {
    background: #fff;
    color: #b01800;
    padding: 7px 18px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 800;
    text-decoration: none;
    letter-spacing: 0.5px;
    white-space: nowrap;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .hs-cta:hover { background: #fff3; color: #fff; border: 1px solid #fff; }

  @media (max-width: 700px) {
    .hs-divider { display: none; }
    .hs-active { padding: 10px 12px; }
    .hs-inner { gap: 10px; }
    .hs-hs { font-size: 16px; }
    .hs-badge-pct { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="hs-active">
  <div class="hs-inner">

    <div class="hs-logo">
      <span class="hs-fire">🔥</span>
      <span class="hs-hs">HOT SALE 2026</span>
      <span class="hs-fire">🔥</span>
    </div>

    <div class="hs-divider"></div>

    <div class="hs-badge">
      <span class="hs-badge-pct">15%</span>
      <span class="hs-badge-txt">OFF<br>Hoja Entera</span>
    </div>

    <div class="hs-badge">
      <span class="hs-badge-pct">10%</span>
      <span class="hs-badge-txt">OFF<br>Media Hoja</span>
    </div>

    <div class="hs-badge">
      <span class="hs-badge-pct">10%</span>
      <span class="hs-badge-txt">OFF<br>Accesorios</span>
    </div>

    <div class="hs-divider"></div>

    <div class="hs-end">
      ⏳ Termina en: <span class="hs-end-countdown" id="hs-end-timer">cargando...</span>
    </div>

    <a href="/collections/piel-automotriz" class="hs-cta">¡Comprar ahora!</a>

  </div>
</div>

<script>
  (function() {
    var end = new Date('2026-06-03T00:00:00-06:00').getTime();
    function update() {
      var diff = end - Date.now();
      if (diff <= 0) {
        document.querySelector('.hs-active').style.display = 'none';
        return;
      }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      document.getElementById('hs-end-timer').textContent =
        d + 'd ' + String(h).padStart(2,'0') + 'h ' + String(m).padStart(2,'0') + 'm';
    }
    update();
    setInterval(update, 30000);
  })();
</script>

</body>
</html>
